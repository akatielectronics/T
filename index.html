<style>
#api-host-note{display:none;position:relative;z-index:10000;padding:12px 18px;background:#fff1cf;color:#4a3510;border-bottom:1px solid #e7c36b;font:500 14px/1.5 system-ui,sans-serif;text-align:center}
#api-host-note strong{font-weight:700}
</style>
</head>
<body>
<div id="api-host-note" role="status" aria-live="polite"><strong>Backend unavailable.</strong> This single-file storefront needs the AKATI API at <code>/api</code> on the same website for products and admin sign-in. GitHub Pages cannot run that API; host the full app and API together to use <code>#admin</code>.</div>
<div id="root"></div>
<script>
(() => {
  const note = document.getElementById('api-host-note');
  const show = () => { note.style.display = 'block'; };
  if (location.protocol === 'file:') { show(); return; }
  fetch('/api/healthz', { cache: 'no-store', credentials: 'same-origin' })
    .then((response) => { if (!response.ok) show(); })
    .catch(show);
})();
</script>
